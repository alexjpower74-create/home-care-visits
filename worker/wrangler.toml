name = "home-care-visits"
main = "src/index.js"
compatibility_date = "2026-09-01"

# One Worker serves the API (/api/*, Worker first) and the static app from ../app/public (same origin).
[assets]
directory = "../app/public"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "home-care-visits"
# Live D1 id (created 2026-09-15). Local dev uses its own copy under --persist-to.
database_id = "c953b098-c785-4643-b6f1-ede37553d4fd"
migrations_dir = "migrations"

# No TEST_MODE here, ever. Tests pass it on the command line: --var TEST_MODE:1
