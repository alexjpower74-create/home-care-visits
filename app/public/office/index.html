<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/vendor/maplibre-gl/maplibre-gl.css">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/office/office.css">
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/vendor/maplibre-gl/maplibre-gl.js"></script>
<script src="/vendor/maplibre-gl-leaflet/leaflet-maplibre-gl.js"></script>
</head>
<body>
<header class="top office-top">
  <div class="office-bar">
    <div class="brand">
      <span class="agency" id="agency">Home Care Visits</span>
      <span class="badge" id="badge" hidden>SAMPLE</span>
    </div>
    <button type="button" id="signout" class="btn btn-outline btn-inline" hidden>Sign out</button>
  </div>
  <nav id="tabs" class="tabs" aria-label="Office sections" hidden>
    <a href="#today" data-tab="today">Today</a>
    <a href="#week" data-tab="week">Week</a>
    <a href="#clients" data-tab="clients">Clients</a>
    <a href="#workers" data-tab="workers">Workers</a>
    <a href="#reports" data-tab="reports">Reports</a>
    <a href="#settings" data-tab="settings">Settings</a>
  </nav>
</header>
<main id="view" class="office-main"><p class="empty">Loading…</p></main>
<div id="sheet-root"></div>
<script type="module" src="/office/app.js"></script>
</body>
</html>
